name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.6"
  UV_LOCKED: "1"
  HYPOTHESIS_PROFILE: ci
  # Dummy settings the app reads at import. Not secrets.
  JWT_SECRET_KEY: ci-test-secret-key-long-enough-for-hs256-and-the-hs512-negative-test
  POSTGRES_SERVER: localhost
  POSTGRES_USER: ci
  POSTGRES_PASSWORD: ci
  POSTGRES_DB: ci
  REDIS_HOST: localhost
  SMTP_HOST: localhost
  SMTP_USER: ci@example.com
  SMTP_PASSWORD: ci
  EMAILS_FROM_EMAIL: ci@example.com
  EMAILS_FROM_NAME: CI

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --group dev
      - run: uv run ruff check app tests
      - run: uv run mypy
      - name: No module in app/ over 800 lines
        run: |
          long=$(find app -name '*.py' -print0 | xargs -0 wc -l | awk '$2 != "total" && $1 > 800')
          if [ -n "$long" ]; then echo "$long"; exit 1; fi
      - name: Known vulnerabilities in uv.lock
        run: |
          uv export --all-groups --all-extras --no-emit-project --no-header --format requirements-txt -o "$RUNNER_TEMP/req.txt"
          uvx pip-audit==2.10.1 --require-hashes --disable-pip --progress-spinner off -r "$RUNNER_TEMP/req.txt"

  test:
    # SQLite and fakeredis. Timing tests are flaky beside parallel workers, so
    # they run alone after, appending to the same coverage data.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --group dev
      - run: uv run pytest tests/ -q -n auto --dist worksteal -m "not timing_sensitive" --cov=app --cov-report= --cov-fail-under=0
      - name: Timing-sensitive tests alone (85% gate on the sum)
        run: uv run pytest tests/ -q -m timing_sensitive --cov=app --cov-append --cov-report=term-missing
      - name: Payment layer coverage gate (100% lines and branches)
        run: >-
          uv run coverage report --fail-under=100
          --include="app/api/v1/orders/*.py,app/services/orders.py,app/services/payment/*.py,app/schemas/order.py,app/models/order.py,app/models/order_items.py,app/models/payment.py,app/models/payment_ledger.py,app/tasks.py,app/services/email/messages.py,app/services/stripe_events.py,app/services/stripe_event_redaction.py,app/services/reconciliation.py,app/models/payment_discrepancy.py,app/schemas/webhook_event.py"
          --omit="app/services/payment/stripe_provider.py"

  integration:
    # The PostgreSQL and Redis images docker-compose.yml deploys.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ci -d ci" --health-interval 5s --health-retries 12
      redis:
        image: redis:8.8-alpine@sha256:c027ae0f677dcf73d74038256f5b88c9ba7b11ccbfae97e96a9f091208d36125
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
      REAL_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # migration_compat.sh needs the tags
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --group dev
      - name: Suite on PostgreSQL
        run: uv run pytest tests/ -m "not timing_sensitive" -q -p no:cacheprovider -rs -n auto --dist worksteal
      - name: Timing-sensitive database tests, alone
        run: uv run pytest tests/ -m "db_sensitive and timing_sensitive" -q -p no:cacheprovider -rs
      - name: Redis-semantics tests on a real Redis
        run: uv run pytest tests/ -m real_redis -q -p no:cacheprovider -rs
      - name: Previous release on the current migrations (rolling deploy)
        run: bash .github/scripts/migration_compat.sh "$(git describe --tags --abbrev=0 HEAD)"

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test, integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version and date for the OCI labels
        id: meta
        run: |
          echo "version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: fastapi-ecommerce-backend:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
      - run: |
          docker build --pull -t ecommerce-postgres:ci docker/postgres
          docker build --pull -t ecommerce-redis:ci docker/redis
      # OS packages and binaries of the shipped images; only fixable HIGH/CRITICAL fail.
      - name: Trivy scan of the three images
        env:
          TRIVY: aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c # 0.76.1
        run: |
          status=0
          for image in fastapi-ecommerce-backend:ci ecommerce-postgres:ci ecommerce-redis:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$GITHUB_WORKSPACE:/repo:ro" \
              "$TRIVY" image --skip-version-check --ignorefile /repo/.trivyignore.yaml \
              --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$image" || status=1
          done
          exit $status
