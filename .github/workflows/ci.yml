name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  UV_VERSION: "0.13.5"
  # Hypothesis settings profile registered in tests/conftest.py (more examples,
  # random seeds, print_blob); every test job below inherits it.
  HYPOTHESIS_PROFILE: ci

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Ruff lint
        run: uv run ruff check app tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --group dev
      # Two runs, one coverage file. The parallel run (pytest-xdist, one SQLite
      # database and one fakeredis server per worker) skips the 21 tests that
      # assert on elapsed time or event-loop latency, because CPU contention from
      # other workers would make them flaky; they run alone right after, with
      # --cov-append, so the coverage numbers and both gates see every test.
      # The 85% gate is enforced on the combined data in the second run (the
      # first one cannot reach it without the second's tests).
      - name: Run tests in parallel with coverage
        env:
          JWT_SECRET_KEY: ci-test-secret-key-long-enough-for-hs256-and-the-hs512-negative-test
          POSTGRES_SERVER: localhost
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          REDIS_HOST: localhost
          SMTP_HOST: localhost
          SMTP_USER: ci@example.com
          SMTP_PASSWORD: ci
          EMAILS_FROM_EMAIL: ci@example.com
          EMAILS_FROM_NAME: CI
        run: >-
          uv run pytest tests/ -q -n auto --dist worksteal -m "not timing_sensitive"
          --cov=app --cov-report= --cov-fail-under=0
      - name: Run the timing-sensitive tests alone (coverage gate at 85%)
        env:
          JWT_SECRET_KEY: ci-test-secret-key-long-enough-for-hs256-and-the-hs512-negative-test
          POSTGRES_SERVER: localhost
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          REDIS_HOST: localhost
          SMTP_HOST: localhost
          SMTP_USER: ci@example.com
          SMTP_PASSWORD: ci
          EMAILS_FROM_EMAIL: ci@example.com
          EMAILS_FROM_NAME: CI
        run: >-
          uv run pytest tests/ -q -m timing_sensitive
          --cov=app --cov-append --cov-report=term-missing --cov-report=xml
      - name: Payment layer coverage gate (100% lines and branches)
        run: >-
          uv run coverage report --fail-under=100
          --include="app/api/v1/orders.py,app/services/orders.py,app/services/payment/*.py,app/schemas/order.py,app/models/order.py,app/models/order_items.py,app/models/payment.py,app/models/payment_ledger.py,app/tasks.py,app/services/email/messages.py,app/services/stripe_events.py,app/services/reconciliation.py,app/models/payment_discrepancy.py,app/schemas/webhook_event.py"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml

  test-timezones:
    # Payment and order code compares and stores timestamps; run just those
    # tests under zones that differ from UTC by the extremes (+14, -11), a
    # 45-minute offset and a half-hour offset with DST, and two zones whose
    # clocks change on the dates the DST tests use (Europe/Bratislava,
    # America/New_York). No coverage here: the
    # full suite in the test job already measures it.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz:
          - UTC
          - Pacific/Kiritimati
          - Pacific/Pago_Pago
          - Asia/Kathmandu
          - America/St_Johns
          - Europe/Bratislava
          - America/New_York
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Payment and order tests under TZ=${{ matrix.tz }}
        env:
          TZ: ${{ matrix.tz }}
          JWT_SECRET_KEY: ci-test-secret-key-long-enough-for-hs256-and-the-hs512-negative-test
          POSTGRES_SERVER: localhost
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          REDIS_HOST: localhost
          SMTP_HOST: localhost
          SMTP_USER: ci@example.com
          SMTP_PASSWORD: ci
          EMAILS_FROM_EMAIL: ci@example.com
          EMAILS_FROM_NAME: CI
        run: >-
          uv run pytest -q -p no:cacheprovider -n auto --dist worksteal
          tests/integration/test_payment*.py
          tests/integration/test_order*.py
          tests/integration/test_checkout_session*.py
          tests/integration/test_refund*.py
          tests/integration/test_disputes.py
          tests/integration/test_webhook*.py
          tests/integration/test_tasks*.py
          tests/integration/test_stripe_event*.py
          tests/integration/test_reconciliation*.py
          tests/integration/test_admin_webhook_events.py
          tests/integration/test_dst_clock.py
          tests/unit/test_payment*.py
          tests/unit/test_order*.py
          tests/unit/test_money*.py
          tests/unit/test_webhook*.py
          tests/unit/test_reconciliation*.py
          tests/unit/test_dst_*.py

  test-postgres:
    # The main test job runs on a temporary SQLite database. Production is
    # PostgreSQL, so what only PostgreSQL does (row locks in the pay path,
    # CHECK constraints, the unique index on lower(email), the refund and
    # dispute tables, the Alembic migrations) is checked here: the tests that
    # depend on the database (marker db_sensitive, applied by file name in
    # tests/conftest.py) plus the PostgreSQL-only ones, against a real server.
    # tests/conftest.py creates a throwaway database on it, builds the schema
    # with `alembic upgrade head` and drops it at the end.
    #
    # One run per PostgreSQL major: 15 is what docker-compose.yml deploys
    # (SETUP.md: "15+"), 16 and 18 are the other supported majors. 15 runs the
    # whole suite on PostgreSQL (everything that does not assert on elapsed
    # time), 16 and 18 the database-sensitive subset: the subset is ~80% of the
    # whole run's time (11 min of ~15 on two local workers), so the full suite
    # on each major would triple the cost for ~20% more coverage of code that
    # does not touch the database differently between majors. Images by tag and
    # digest, each digest more than two weeks old when pinned; 15's is the one
    # test_docker_compose.py keeps equal to docker-compose.yml.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: "15"
            image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
            selection: not timing_sensitive
          - postgres: "16"
            image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
            selection: db_sensitive and not timing_sensitive
          - postgres: "18"
            image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
            selection: db_sensitive and not timing_sensitive
    name: test-postgres (PostgreSQL ${{ matrix.postgres }})
    services:
      postgres:
        # max_connections stays at the default 100 here: a service container
        # cannot pass the `-c max_connections=200` that docker-compose.yml
        # sets, and the tests open far fewer.
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Tests on PostgreSQL ${{ matrix.postgres }} (${{ matrix.selection }})
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
          JWT_SECRET_KEY: ci-test-secret-key-long-enough-for-hs256-and-the-hs512-negative-test
          POSTGRES_SERVER: localhost
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          REDIS_HOST: localhost
          SMTP_HOST: localhost
          SMTP_USER: ci@example.com
          SMTP_PASSWORD: ci
          EMAILS_FROM_EMAIL: ci@example.com
          EMAILS_FROM_NAME: CI
        run: uv run pytest tests/ -m "${{ matrix.selection }}" -q -p no:cacheprovider -rs -n auto --dist worksteal
      - name: Timing-sensitive database tests on PostgreSQL, alone
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
          JWT_SECRET_KEY: ci-test-secret-key-long-enough-for-hs256-and-the-hs512-negative-test
          POSTGRES_SERVER: localhost
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          REDIS_HOST: localhost
          SMTP_HOST: localhost
          SMTP_USER: ci@example.com
          SMTP_PASSWORD: ci
          EMAILS_FROM_EMAIL: ci@example.com
          EMAILS_FROM_NAME: CI
        run: uv run pytest tests/ -m "db_sensitive and timing_sensitive" -q -p no:cacheprovider -rs

  test-redis:
    # The suite runs on fakeredis (tests/conftest.py). The tests marked
    # real_redis are the parametrizations of tests/integration/
    # test_real_redis_parity.py that run on a real server instead: the
    # rate-limit Lua script, token revocation, SET NX guards, WATCH/MULTI
    # against a competing writer, expiry and the stored JSON. The same tests
    # run on fakeredis in the other jobs, so a difference between emulator and
    # server shows up as one failing parametrization. The image is the one
    # docker-compose.yml runs (test_docker_compose.py keeps them equal).
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Redis-semantics tests on a real Redis
        env:
          REAL_REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-test-secret-key-long-enough-for-hs256-and-the-hs512-negative-test
        run: uv run pytest tests/ -m real_redis -q -p no:cacheprovider -rs

  audit:
    # Fails the build when a package pinned in uv.lock has a known
    # vulnerability (PyPI Advisory Database, via pip-audit). The requirements
    # file is exported from the lock, with hashes, so pip-audit audits exactly
    # the pinned versions and files (--require-hashes: no resolution, nothing
    # installed). All dependency groups are included on purpose: the dev group
    # runs in CI with the repository checked out, so it is part of the supply
    # chain too. The project itself is not on PyPI and is left out.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Export the locked dependencies
        run: >-
          uv export --locked --all-groups --all-extras --no-emit-project --no-header
          --format requirements-txt --output-file "$RUNNER_TEMP/requirements-audit.txt"
      - name: Generate the CycloneDX SBOM of the locked dependencies
        # uv's own CycloneDX 1.5 export of uv.lock (all groups, as the audit).
        # Runs before the audit and is uploaded even when the audit fails.
        run: >-
          uv export --locked --all-groups --all-extras --no-emit-project --no-header
          --format cyclonedx1.5 --output-file "$RUNNER_TEMP/bom.cdx.json"
      - name: Upload the SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: ${{ runner.temp }}/bom.cdx.json
          if-no-files-found: error
      - name: Audit locked dependencies for known vulnerabilities
        run: >-
          uvx pip-audit==2.10.1 --require-hashes --disable-pip
          --progress-spinner off -r "$RUNNER_TEMP/requirements-audit.txt"

  secrets:
    # Scans every commit of the history for committed credentials (gitleaks,
    # default rules plus .gitleaks.toml, which allowlists the test data and
    # the CI stub that look like keys). Run from the image by tag and digest,
    # like the base images in the Dockerfile. fetch-depth: 0 because the
    # default checkout is one commit deep. safe.directory: the checkout is
    # owned by the runner user, the scanner runs as root in the container.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan the history with gitleaks
        run: >-
          docker run --rm
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          -v "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --no-banner

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, audit, secrets, test, test-timezones, test-postgres, test-redis]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build metadata for the OCI labels
        id: meta
        run: |
          echo "version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: fastapi-ecommerce-backend:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
