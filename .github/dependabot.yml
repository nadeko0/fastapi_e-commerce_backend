version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown: {default-days: 14}
    groups:
      actions:
        update-types: ["minor", "patch"]
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown: {default-days: 14}
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown: {default-days: 14}
    ignore: [{dependency-name: "python", update-types: ["version-update:semver-major"]}]
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown: {default-days: 14}
    ignore: [{dependency-name: "postgres", update-types: ["version-update:semver-major"]}]
