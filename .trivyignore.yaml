# Trivy ignore list (experimental YAML form; Trivy only reads it when named with
# --ignorefile .trivyignore.yaml, see the image-scan job in .github/workflows/ci.yml).
#
# Two cases. The second (krb5-libs, libxslt) is at the end of the file and
# expires on its own.
#
# 1. Permanent until a newer gosu build: the Go standard library inside
# /usr/local/bin/gosu of the official postgres images, which tianon/gosu builds
# with an old Go toolchain (go1.24.6) and no newer postgres image fixes. gosu's
# SECURITY.md asks for scanner reports to be checked with govulncheck for
# reachability. govulncheck v1.9.0 in binary mode (symbol level, vulnerability
# database of 2026-10-21) on the gosu of postgres:15-alpine finds no call to the
# vulnerable symbol of any ID below; gosu only drops privileges at container
# start. Each ID is ignored for the path usr/local/bin/gosu only: the same ID
# in any other file still fails the scan.
#
# Re-checked on 2026-11-10 for postgres:18.6-alpine: its /usr/local/bin/gosu
# is byte for byte the binary analysed above (sha256 52c8749d0142edd2...,
# gosu 1.19, go1.24.6), and Trivy reports the same 26 IDs without this file.
#
# Re-check when the postgres digest in docker-compose.yml changes, and drop
# every entry whose fixed Go version a newer gosu build carries (the scan then
# no longer reports it): run `govulncheck -mode=binary` on the extracted
# /usr/local/bin/gosu again and `trivy image --ignorefile` without this file.
vulnerabilities:
