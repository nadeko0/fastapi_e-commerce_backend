# 2. Temporary, expiring 2026-11-24: Alpine packages of postgres:18.6-alpine
# (digest of 2026-11-05) that Alpine has already fixed (krb5-libs 1.22.3-r0,
# libxslt 1.1.43-r4) but the official image has not been rebuilt with yet.
# Checked in the image on 2026-11-10:
# - krb5-libs: the image has no Kerberos server (no krb5kdc, no kadmind); the
#   libraries are linked into postgres for GSSAPI only, and this deployment
#   authenticates with scram-sha-256 on a port bound to 127.0.0.1 and the
#   backend network. The listed IDs are KDC and kadmind issues by their titles.
# - libxslt: only /usr/local/lib/postgresql/pgxml.so (the xml2 extension) links
#   it, and nothing here runs CREATE EXTENSION xml2.
# On expiry the scan fails again: move the digest to a rebuilt image (the scan
# then no longer reports these) or re-check and extend with a reason.
