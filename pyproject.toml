[project]
name = "fastapi-ecommerce-backend"
version = "1.1.0"
description = "E-commerce backend API with FastAPI"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy[asyncio]",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "python-jose",
    "bcrypt",
    "cryptography",
    "python-multipart",
    "email-validator",
    "python-dotenv",
    "redis",
    "celery",
    "stripe",
    "psycopg[binary]",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "pytest-cov",
    "ruff",
    "freezegun",
    "fakeredis",
    "hypothesis",
    "aiosqlite",
    "lupa",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
# Without this, coverage.py loses track of a coroutine after it awaits a
# SQLAlchemy asyncio call (which switches greenlets) and reports the rest
# of the function as never run: routes on AsyncSession showed 65% while
# their tests exercised every line.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E501 (line too long) is ignored rather than enforced: most remaining
# violations are long f-string HTML email templates and SQLAlchemy
# CheckConstraint strings, where reformatting to fit 100 chars produces
# less readable code than the original single line. Everything else
# (unused imports/vars, undefined names, import order/placement) is a
# real hard gate.
ignore = ["E501"]
