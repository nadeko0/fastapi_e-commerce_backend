[project]
name = "fastapi-ecommerce-backend"
version = "6.2.0"
description = "E-commerce backend API with FastAPI"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy[asyncio]",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "pyjwt",
    "bcrypt",
    "cryptography",
    "python-multipart",
    "email-validator",
    "python-dotenv",
    "redis",
    "celery",
    "stripe",
    "psycopg[binary]",
]

[project.optional-dependencies]
telemetry = [
    "opentelemetry-api==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-celery==0.66b2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-redis==0.66b2",
    "opentelemetry-instrumentation-requests==0.66b2",
    "opentelemetry-instrumentation-sqlalchemy==0.66b2",
    "opentelemetry-sdk==1.45.2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "freezegun",
    "fakeredis",
    "hypothesis",
    "aiosqlite",
    "lupa",
    "httpx2>=2.13.1",
    "pytest-xdist==3.8.0",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-sqlalchemy==0.66b2",
    "opentelemetry-instrumentation-redis==0.66b2",
    "opentelemetry-instrumentation-celery==0.66b2",
    "opentelemetry-instrumentation-requests==0.66b2",
    "mypy==2.4.0",
    "pytest-socket==0.8.1",
    "pytest-randomly==5.0.0",
    "pytest-benchmark==5.3.1",
]

[tool.uv]
# Dependency age rule: a release is a lock candidate only once it is a week old,
# so a malicious or broken fresh upload has time to be caught and yanked. One
# week, not two: over Nov 2025 - Nov 2026 every yanked release of a locked
# package was replaced within 4 days, and no release found bad later was found
# within 14 days, while 30 security fixes waited 7 days longer under two weeks.
# A security fix that cannot wait is let through per package with
# exclude-newer-package (see the dependency-age-rule note), never by loosening this.
exclude-newer = "1 week"

[tool.pytest]
minversion = "9.0"
# Not `strict = true`: it also enables strict_parametrization_ids, which
# rejects duplicate generated ids in test_redis_parity.py and test_catalog_money.py.
strict_config = true
strict_markers = true
strict_xfail = true
addopts = [
    "-ra",
    # pytest-socket: a test that opens a connection to anything but this machine
    # fails. It guards socket.connect, so it stops Python's HTTP and SMTP clients,
    # the ways a test could reach Stripe or a mail server. It does not see libpq
    # or name lookups, and a TEST_DATABASE_URL on another host needs its own
    # --allow-hosts. The live Stripe tests are the one exception (enable_socket).
    "--allow-hosts=127.0.0.1,::1,localhost",
    "--allow-unix-socket",
    # tests/benchmarks run once each, as plain tests, in every ordinary run;
    # the benchmark CI job turns timing on with --benchmark-enable.
    "--benchmark-disable",
]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error::jwt.warnings.InsecureKeyLengthWarning",
    # datetime.utcnow() is deprecated (Python 3.12); use app.core.clock.utc_now().
    "error:datetime.datetime.utcnow:DeprecationWarning",
    # A connection left open warns only when it is garbage collected, i.e. in
    # whichever test happens to trigger the collection. The ResourceWarning
    # itself is raised inside __del__, so pytest sees it as an unraisable
    # exception: both categories have to be errors for the guard to bite.
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
    # Every Pydantic deprecation: the V1-style API (from_orm, .dict(), @validator,
    # class Config, PydanticDeprecatedSince20) and every later one derive from this base.
    "error::pydantic.warnings.PydanticDeprecationWarning",
    # FastAPI's own deprecations (a UserWarning subclass).
    "error::fastapi.exceptions.FastAPIDeprecationWarning",
]
markers = [
    "timing_sensitive: asserts on elapsed time or event-loop latency; run alone, not beside other xdist workers (-m timing_sensitive)",
    "db_sensitive: outcome depends on the database (locks, constraints, indexes, migrations); applied by file name in tests/conftest.py, run on PostgreSQL in CI",
    "real_redis: runs on the Redis server named by REAL_REDIS_URL (parametrization backend=real of tests/integration/test_real_redis_parity.py); skipped without it, run by CI job test-redis",
]

[tool.coverage.run]
source = ["app"]
# Measure branches as well as lines: a line-only report hides an untested
# else/early-return arm. The payment layer is gated at 100% in CI (see the
# "Payment layer coverage gate" step in .github/workflows/ci.yml).
branch = true
# Without this, coverage.py loses track of a coroutine after it awaits a
# SQLAlchemy asyncio call (which switches greenlets) and reports the rest
# of the function as never run: routes on AsyncSession showed 65% while
# their tests exercised every line.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.mypy]
files = ["app"]
python_version = "3.13"
# Without the plugin mypy reads a Pydantic model as a plain class and rejects
# every keyword argument of its constructor.
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
no_implicit_optional = true
# Components of `mypy --strict` (config_file docs); the rest of strict is applied
# to the payment layer below.
warn_return_any = true
warn_unreachable = true
disallow_any_generics = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]

# Payment layer and Celery tasks: fully annotated definitions.
[[tool.mypy.overrides]]
module = [
    "app.tasks",
    "app.services.payment.*",
    "app.services.stripe_events",
    "app.services.reconciliation",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Celery ships neither py.typed nor stubs; its objects are Any here.
[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E501 (line too long) is ignored rather than enforced: most remaining
# violations are long f-string HTML email templates and SQLAlchemy
# CheckConstraint strings, where reformatting to fit 100 chars produces
# less readable code than the original single line. Everything else
# (unused imports/vars, undefined names, import order/placement) is a
# real hard gate.
ignore = [
    "E501",
    # UP042 (str + Enum -> StrEnum) changes str()/format() of members: a behaviour
    # change, not a mechanical rewrite. Tracked separately.
    "UP042",
    # UP046 (PEP 695 generic class syntax) is a hand migration of the one generic
    # response model. Tracked separately.
    "UP046",
    # SIM300 (yoda conditions) would turn `assert x == expected` into `assert expected == x`
    # in the tests: the actual-then-expected order is the project convention.
    "SIM300",
    # PT006 (tuple of names in parametrize) and PT018 (split `assert a and b`) are
    # style-only: 158 and 103 hits across the tests, no defect class behind them.
    "PT006",
    "PT018",
    # PLW0603 (global statement): three lazily built module singletons (compiled Lua
    # script, trace source, one-shot log flag); the alternative is a holder object.
    "PLW0603",
]
# Added on top of E/F/I/W: pyupgrade (UP), bugbear (B), async pitfalls (ASYNC),
# naive datetimes (DTZ), FastAPI (FAST), simplifications (SIM), and the Ruff-specific
# RUF005 (list/tuple concatenation), RUF012 (mutable class defaults), RUF013
# (implicit Optional), RUF022 (sorted __all__), RUF100 (stale noqa).
extend-select = ["UP", "B", "ASYNC", "DTZ", "FAST", "SIM", "RUF005", "RUF012", "RUF013", "RUF022", "RUF100",
    "G", "LOG", "BLE", "PGH003", "PIE", "C4", "RET", "PT", "T20", "PLE", "PLW", "TID251",
    "C901", "PLR0912", "PLR0915"]
# Second batch: logging format (G, LOG), blind except (BLE), type: ignore without code
# (PGH003), PIE, comprehensions (C4), return statements (RET), pytest style (PT),
# print (T20), pylint errors and warnings (PLE, PLW).
# Function size: complexity (C901), branches (PLR0912), statements (PLR0915), with
# limits above Ruff's defaults (10/12/50): about a dozen app functions sit just past
# the defaults and read fine as they are; the limits stop one from growing further.

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-branches = 15
max-statements = 60

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"app.services.redis.RedisService".msg = "Use the helpers in app.services.redis or app.tasks; only those two modules may name RedisService."

[tool.ruff.lint.per-file-ignores]
"app/tasks.py" = ["TID251"]
# The tests build and patch RedisService directly. Test scenarios and data strategies
# are long by design: the function-size limits are for app/.
"tests/**" = ["TID251", "C901", "PLR0912", "PLR0915"]
# Auth code changes only when a task names it; four `x = jwt.encode(); return x` pairs stay.
"app/core/security.py" = ["RET504"]
"app/services/redis.py" = ["TID251"]
# This file builds throwaway FastAPI apps whose routes are deliberately written in the
# shapes the architecture guard must catch (default-style Depends, an untyped
# dependency, time.sleep in an async route); rewriting them would stop testing the guard.
"tests/integration/test_no_blocking_on_loop.py" = ["B008", "FAST002", "ASYNC251"]
