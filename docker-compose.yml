# Docker's default json-file driver keeps container stdout/stderr forever,
# so a long-running stack (celery at --loglevel=info especially) eventually
# fills the host disk under /var/lib/docker/containers. Cap it per container:
# 3 files x 10 MB. app.log inside api_logs is rotated separately by the
# app's own RotatingFileHandler (app/core/logging_config.py).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      # Host-exposed port (DOCKER_API_PORT) is deliberately a separate
      # variable from the app's own PORT setting: PORT also controls what
      # port uvicorn binds to *inside* the container (app/core/config.py,
      # read by main.py) - reusing the same variable for both meant
      # changing the host-published port (e.g. to avoid a conflict with
      # another service on the same host) also silently changed the
      # container-internal bind port away from 8000, which this file's own
      # hardcoded container-side "8000" and the Dockerfile's HEALTHCHECK
      # both still assumed. Confirmed by actually deploying this image to a
      # real server: the container ran and reported healthy startup, but
      # nothing was reachable on the mapped host port because uvicorn was
      # listening on a different port than the one being forwarded to.
      - "${DOCKER_API_PORT:-8000}:8000"
    env_file:
      - .env
    # The unprivileged role (docker/postgres/initdb/10-app-role.sh), not
    # POSTGRES_USER from .env, which is the superuser and schema owner.
    environment:
      POSTGRES_USER: ${APP_DB_USER:?APP_DB_USER must be set in .env}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in .env}
    volumes:
      - api_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    logging: *default-logging
    # Python, not curl: the runtime image is python:3.13-slim with nothing
    # installed on top (see Dockerfile), so there is no curl in it. Same
    # probe as the Dockerfile's own HEALTHCHECK; /health answers 503 when the
    # database or Redis is unreachable, which urlopen raises on.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel=info"]
    # `docker stop` sends SIGTERM, a Celery warm shutdown: running tasks
    # finish. After stop_grace_period (default 10 s) Docker sends SIGKILL,
    # and a task killed mid-run is redelivered only after the broker's
    # visibility_timeout (1 h, acks_late). task_time_limit is 300 s, so wait
    # 330 s (hard limit plus margin).
    stop_grace_period: 330s
    env_file:
      - .env
    # The unprivileged role (docker/postgres/initdb/10-app-role.sh), not
    # POSTGRES_USER from .env, which is the superuser and schema owner.
    environment:
      POSTGRES_USER: ${APP_DB_USER:?APP_DB_USER must be set in .env}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in .env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    # --schedule: beat keeps its last-run times in a file, by default
    # "celerybeat-schedule" in the working directory. /app is owned by root
    # in the image and the process runs as appuser, so the default location
    # is not writable and beat would exit on startup. /tmp is.
    # The file is lost with the container, which is fine: the daily job uses
    # a crontab (fixed clock time), and the timedelta ones (5 min to 4 h)
    # just restart their interval. A volume for it would need a directory
    # owned by appuser in the image for no gain.
    command:
      - celery
      - -A
      - app.tasks
      - beat
      - --loglevel=info
      - --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    # The unprivileged role (docker/postgres/initdb/10-app-role.sh), not
    # POSTGRES_USER from .env, which is the superuser and schema owner.
    environment:
      POSTGRES_USER: ${APP_DB_USER:?APP_DB_USER must be set in .env}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in .env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    logging: *default-logging
    # Without this, celery-beat inherits the Dockerfile's HEALTHCHECK (an
    # HTTP GET to :8000/health) built for the api image - beat runs no web
    # server, so that check always fails and Docker permanently reports it
    # "unhealthy" even when beat itself is fine. There's no equivalent
    # non-invasive liveness probe for beat (unlike celery-worker's `celery
    # inspect ping`), so disable the inherited check instead of failing it.
    healthcheck:
      disable: true

  # Migrations, as POSTGRES_USER (the schema owner; the api's role cannot
  # create or alter tables). Not started by `docker compose up`:
  #   docker compose --profile migrate run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - migrate
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    logging: *default-logging
    healthcheck:
      disable: true

  db:
    # Tag and digest, as in the Dockerfile (see the note there).
    image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    # max_connections: each API worker can open up to 2 x (DB_POOL_SIZE +
    # DB_MAX_OVERFLOW) connections (a sync and an async pool), so 4 workers
    # with the default 10 + 5 can reach 120, plus the Celery worker. The
    # Postgres default of 100 is below that.
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Run once, on an empty data directory: creates APP_DB_USER, the role
      # the api and Celery connect as.
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    env_file:
      - .env
    ports:
      # Loopback only: for a developer's own tools. Without an address Docker
      # listens on every interface, past the host's firewall (it writes its
      # own iptables rules). The services use the backend network.
      - "127.0.0.1:${DOCKER_POSTGRES_PORT:-5432}:5432"
    networks:
      - backend
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - APP_DB_USER=${APP_DB_USER:?APP_DB_USER must be set in .env}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in .env}

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # One Redis holds the Celery broker queues, the token blacklist and
    # password-change watermarks, the rate-limit counters and every cart.
    # maxmemory: without it, growth (guest carts above all: anyone can make
    # one) goes on until the kernel kills the container, and everything in
    # it goes at once. noeviction: when full, Redis refuses writes and drops
    # nothing. Every evicting policy would drop something that must stay:
    # allkeys-* the Celery queues (no TTL), volatile-* the blacklist entries
    # and watermarks (TTL), which would make revoked tokens valid again.
    # A refused write is answered as Redis being down (a cart change is a
    # 503, nothing changed). Separating the broker into a logical database
    # would not help: maxmemory is per instance. Size REDIS_MAXMEMORY below
    # the container's memory; RATE_LIMIT_GUEST_CART bounds how fast guest
    # carts can fill it.
    # Persistence: the default is RDB snapshots only, so a crash (OOM kill,
    # host loss) loses the writes since the last snapshot - revoked tokens
    # and password-change watermarks come back to life. AOF with fsync every
    # second (the default policy, stated here) loses at most about a second;
    # RDB stays on as well (redis.io persistence docs recommend both). Files
    # go to /data, the redis_data volume. An instance that already holds data
    # must be switched on live first (`redis-cli config set appendonly yes`,
    # wait for the rewrite to finish in `INFO persistence`), as just
    # restarting with the flag can lose the data (same docs page).
    # REDIS_PASSWORD is required (:?): left empty, it used to become a bare
    # "--requirepass", Redis exited on the config error and nothing that
    # depends on it started. Now `docker compose` refuses with a message.
    # (Redis replaces its own process title, so the password does not stay
    # visible in `ps` inside the container.)
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      # Loopback only, as for db above.
      - "127.0.0.1:${DOCKER_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped
    logging: *default-logging
    # redis-cli takes the password from REDISCLI_AUTH, so the healthcheck's
    # command line does not carry it. Unauthenticated, ping got NOAUTH and
    # the container was never healthy. The reply must be PONG: an error
    # reply alone is not counted on to set redis-cli's exit status.
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  backend:
    name: ${DOCKER_NETWORK_NAME:-ecommerce-network}
    driver: bridge

volumes:
  postgres_data:
    name: ${DOCKER_NETWORK_NAME:-ecommerce}-postgres-data
  redis_data:
    name: ${DOCKER_NETWORK_NAME:-ecommerce}-redis-data
  # Named volume, not a ./logs bind mount: a bind mount always takes the
  # ownership of the host directory, which Docker auto-creates as root on
  # first `up` - the container's non-root appuser (Dockerfile) then can't
  # write app.log and crashes on startup. A named volume initializes from
  # the image's own /app/logs (already chown'd to appuser in the
  # Dockerfile) instead of the host filesystem, avoiding the mismatch.
  # Confirmed by actually deploying this Docker image to a real server.
  api_logs:
    name: ${DOCKER_NETWORK_NAME:-ecommerce}-api-logs